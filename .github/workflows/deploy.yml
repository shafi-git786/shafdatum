name: Build and deploy ASP.NET 4.8 app to Azure Web App

on:
  push:
    branches:
      #- master
      - none
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1.0.5

    - name: Restore NuGet packages
      run: nuget restore

    - name: Build and publish
      run: msbuild /p:DeployOnBuild=true /p:PublishProfile=FolderProfile /p:PublishDir=published

    - name: List published files (debug)
      run: Get-ChildItem -Recurse published | Format-List FullName

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ASP-app
        path: published/**

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ASP-app
        path: ./ASP-app

    - name: List downloaded files (debug)
      run: Get-ChildItem -Recurse ./ASP-app | Format-List FullName

    - name: Zip artifact for deployment
      run: Compress-Archive -Path ASP-app\* -DestinationPath deploy.zip

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'mywebap729'
        package: deploy.zip

    - name: Add deployment URL to summary
      run: echo "### ✅ App deployed! [Open App](https://mywebap729.azurewebsites.net)" >> $GITHUB_STEP_SUMMARY
